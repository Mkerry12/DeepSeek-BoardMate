<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; connect-src * file: data: blob:"
    />
    <title>DeepSeek DeskMate</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="bubble" class="hidden"><div id="bubble-text"></div></div>
    <canvas id="stage"></canvas>
    <div id="hint" class="ui hidden"></div>
    <div id="menu" class="ui hidden" role="menu"></div>

    <form id="chat" class="ui hidden" autocomplete="off">
      <input id="chat-input" placeholder="和小鲸说点什么…" maxlength="1000" />
      <button type="submit" id="chat-send" class="icon-btn" title="发送">
        <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12 20 4l-6 16-3-7-7-1z" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2" />
        </svg>
      </button>
    </form>

    <form id="settings" class="ui panel hidden" autocomplete="off">
      <header class="panel-head">
        <div>
          <h3>设置</h3>
          <p class="panel-sub">DeepSeek DeskMate</p>
        </div>
        <button type="button" id="settings-close" class="icon-btn" title="关闭（Esc）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <div class="panel-body">
        <div class="seg">
          <label><input type="radio" name="mode" value="official" /><span>官方服务器</span></label>
          <label><input type="radio" name="mode" value="apikey" /><span>自己的 API Key</span></label>
        </div>

        <section data-mode="official">
          <div class="field">
            <label for="set-token">访问令牌</label>
            <div class="input-wrap">
              <input id="set-token" name="token" type="password" placeholder="主人发给你的令牌" spellcheck="false" />
              <button type="button" class="icon-btn eye-toggle" title="显示">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="set-model">模型</label>
            <select id="set-model" name="model">
              <option value="">服务器默认</option>
            </select>
          </div>
          <details class="adv">
            <summary>高级</summary>
            <div class="field">
              <label for="set-server">服务器地址</label>
              <input id="set-server" name="serverUrl" spellcheck="false" />
            </div>
          </details>
        </section>

        <section data-mode="apikey">
          <div class="field">
            <label for="set-preset">服务商</label>
            <select id="set-preset" name="preset"></select>
          </div>
          <div class="field">
            <label for="set-key">API Key</label>
            <div class="input-wrap">
              <input id="set-key" name="apiKey" type="password" placeholder="sk-…" spellcheck="false" />
              <button type="button" class="icon-btn eye-toggle" title="显示">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="field" data-preset="custom">
            <label for="set-base">接口地址</label>
            <input id="set-base" name="apiBase" placeholder="https://api.openai.com/v1" spellcheck="false" />
          </div>
          <div class="field">
            <label for="set-api-model">模型</label>
            <select id="set-api-model" name="apiModelPick"></select>
            <input id="set-api-model-name" name="apiModelName" placeholder="例如 gpt-4o-mini" spellcheck="false" />
          </div>
        </section>

        <div class="field">
          <label for="set-persona">人设 <span class="hint">留空使用默认的小鲸</span></label>
          <textarea
            id="set-persona"
            name="persona"
            rows="3"
            maxlength="1000"
            placeholder="例如：你是一只爱吐槽的猫娘…"
          ></textarea>
        </div>

        <div class="field">
          <label>语音</label>
          <div class="remind">
            <label><input type="checkbox" name="voiceOn" />朗读回复</label>
            <label><input type="checkbox" name="sfxOn" />提示音</label>
          </div>
          <select id="set-voice" name="voiceName" title="音色"></select>
          <div class="volume">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9z" />
              <path d="M16.5 8.5a5 5 0 0 1 0 7" />
            </svg>
            <input type="range" id="set-volume" name="volume" min="0" max="100" step="5" title="音量（朗读和提示音）" />
            <output id="set-volume-out" for="set-volume"></output>
          </div>
        </div>

        <div class="field">
          <label>小助手提醒</label>
          <div class="remind">
            <label><input type="checkbox" name="waterOn" />喝水</label>
            <span>每 <input type="number" name="waterMin" min="1" max="600" /> 分钟</span>
          </div>
          <div class="remind">
            <label><input type="checkbox" name="restOn" />休息</label>
            <span>每 <input type="number" name="restMin" min="1" max="600" /> 分钟</span>
          </div>
        </div>

        <div class="field">
          <label>更新 <span class="hint">安装版自动下载，便携版只提醒</span></label>
          <div class="remind">
            <label><input type="checkbox" name="autoUpdate" />自动更新</label>
          </div>
        </div>

        <div id="settings-status" class="status"></div>
      </div>
      <div class="row">
        <button type="button" id="settings-test" class="btn ghost">测试连接</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
