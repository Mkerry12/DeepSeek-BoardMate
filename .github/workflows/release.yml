name: Release

# 推送 v* 标签（如 v0.2.0）时：先检查（标签在 main 上、版本号一致、lint + 测试），
# 再打包 Windows 安装版 + 便携版，发布到 GitHub Release（安装版据此自动更新）
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 和 ci.yml 一致：Cubism Core 没有带版本号的下载地址，按 sha256 锁定内容
  CUBISM_CORE_URL: https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js
  CUBISM_CORE_SHA256: 25ae938cb4fe282ce189b357bcc97e603d1e1f7ec78bf04150d401c23cdc792f

jobs:
  verify:
    name: verify (tag + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          # 要有 origin/main 才能判断标签是不是打在 main 上
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 分支上，只发布合并进 main 的代码"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check tag matches client/package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 client/package.json 的版本 $version 不一致"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  release:
    name: release (windows)
    needs: [verify]
    runs-on: windows-latest
    # 只有这个 job 能写 Release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Download Live2D Cubism Core
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/live2dcubismcore.min.js "$CUBISM_CORE_URL"
          echo "$CUBISM_CORE_SHA256  vendor/live2dcubismcore.min.js" | sha256sum -c -

      - run: npm ci --ignore-scripts
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build
        env:
          # 仓库 Settings → Variables 里可设置 DESKMATE_SERVER_URL 覆盖默认的官方服务器地址
          DESKMATE_SERVER_URL: ${{ vars.DESKMATE_SERVER_URL }}

      # electron-builder 先建草稿 Release 并上传安装包、便携版、latest.yml、blockmap
      - name: Package and upload
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 生成更新说明（按合并的 PR 自动整理），然后正式发布草稿
      - name: Publish release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)"
          printf '%s\n\n%s\n' "$notes" "> 推荐下载 **DeepSeekDeskMate-Setup-*.exe（安装版）**，以后会自动更新；便携版不能自动更新，有新版本时桌宠会提醒你来这里下载。" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek DeskMate $GITHUB_REF_NAME" \
            --notes-file release-notes.md --draft=false --latest
          # electron-builder 不一定把安装包的 .blockmap 传上去（增量更新要用），这里补传
          gh release upload "$GITHUB_REF_NAME" dist/*.blockmap --repo "$GITHUB_REPOSITORY" --clobber
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for pattern in 'Setup-.*\.exe$' 'portable\.exe$' '^latest\.yml$' '\.blockmap$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "::error::Release 缺少匹配 $pattern 的文件"; exit 1; }
          done
