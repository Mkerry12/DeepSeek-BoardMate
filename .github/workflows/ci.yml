name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    # 名字是分支保护里的必需检查，改名要同步改保护规则
    name: client (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # 依赖的安装脚本（electron 下载二进制）在这里用不到
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Cubism Core 只在运行时加载，构建不需要它
      - run: npm run build

  server:
    name: server (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    # 不是分支保护的必需检查：只验证镜像能构建、能启动、/health 正常
    name: docker (build image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: deskmate-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and check /health
        run: |
          docker run -d --name deskmate-ci -p 18000:8000 deskmate-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health
          test "$(docker inspect --format '{{.Config.User}}' deskmate-ci)" = "1001:1001"
      - name: Container logs
        if: always()
        run: docker logs deskmate-ci || true

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: build (windows portable)
    # Windows 分钟数按 2 倍计费：main 推送 / 手动触发时构建，PR 上加 build 标签才构建
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build')
    needs: [client]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Download Live2D Cubism Core
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/live2dcubismcore.min.js https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js
      - run: npm ci --ignore-scripts
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: npm run build
      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: DeepSeekDeskMate-portable-${{ github.sha }}
          path: client/dist/*.exe
          if-no-files-found: error
          retention-days: 14
