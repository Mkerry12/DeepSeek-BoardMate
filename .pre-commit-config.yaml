# 可选：pip install pre-commit && pre-commit install
# 之后每次 git commit 会自动检查改动的文件（ruff / prettier / gitleaks）
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^server/
      - id: ruff-format
        files: ^server/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --prefix client prettier --write --ignore-unknown --config client/.prettierrc --ignore-path client/.prettierignore
        language: system
        files: ^client/(src|test)/
        types_or: [javascript, css, html, json]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
